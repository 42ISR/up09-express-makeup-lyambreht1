info:
  name: change user role
  type: http
  seq: 20

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/users/4/role"
  body:
    type: json
    data: |-
      {
        "role": "moderator"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
