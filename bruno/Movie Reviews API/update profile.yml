info:
  name: update profile
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/profile"
  body:
    type: json
    data: |-
      {
        "username": "admin_updated",
        "bio": "Обновлённая биография"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
